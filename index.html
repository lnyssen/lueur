<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1f1d3d">
  <meta name="description" content="Une odyssée paisible : une fille, un renard, et les lumières du monde à rallumer.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lueur">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Lueur</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="title" hidden>
    <h1>Lueur</h1>
    <p>chapitre 1 · le marais</p>
  </div>
  <button id="gear" type="button" aria-label="Réglages">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
  </button>
  <div id="settings" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title">Réglages</h2>

      <label class="row" for="opt-music">Musique
        <input id="opt-music" type="range" min="0" max="100" step="5">
      </label>
      <label class="row" for="opt-sfx">Bruitages
        <input id="opt-sfx" type="range" min="0" max="100" step="5">
      </label>

      <div class="group" role="group" aria-labelledby="lab-hints">
        <span id="lab-hints">Indices du renard</span>
        <div class="seg">
          <button type="button" data-opt="hints" data-val="auto">Tout seul</button>
          <button type="button" data-opt="hints" data-val="ask">Si je demande</button>
          <button type="button" data-opt="hints" data-val="never">Jamais</button>
        </div>
      </div>

      <div class="group" role="group" aria-labelledby="lab-zoom">
        <span id="lab-zoom">Vue des énigmes</span>
        <div class="seg">
          <button type="button" data-opt="zoom" data-val="auto">Auto</button>
          <button type="button" data-opt="zoom" data-val="near">De près</button>
          <button type="button" data-opt="zoom" data-val="far">En entier</button>
        </div>
      </div>

      <label class="row check" for="opt-calm">Moins d’animations
        <input id="opt-calm" type="checkbox">
      </label>

      <div class="group" role="group" aria-labelledby="lab-chapters">
        <span id="lab-chapters">Rejouer une région</span>
        <div id="opt-chapters" class="chapters"></div>
      </div>

      <div class="actions">
        <button id="opt-restart" type="button" class="quiet">Recommencer l’aventure</button>
        <button id="opt-close" type="button" class="primary">Fermer</button>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
